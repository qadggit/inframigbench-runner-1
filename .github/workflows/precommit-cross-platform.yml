name: Precommit Cross Platform Test

on:
  push:
  pull_request:

jobs:
  precommit:
    name: precommit (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit (cross-platform validation)
        shell: bash
        run: |
          set +e

          echo "Running pre-commit on example.py..."
          output=$(pre-commit run --files example.py 2>&1)
          code=$?

          echo "===== PRE-COMMIT OUTPUT ====="
          echo "$output"
          echo "============================="

          # 1. success
          if [ $code -eq 0 ]; then
            echo "Pre-commit passed"
            exit 0
          fi

          # 2. critical error detection
          if echo "$output" | grep -Eqi "no file|not found|No such file|FileNotFoundError"; then
            echo "Critical pre-commit error detected (real failure)"
            exit 1
          fi

          # 3. non-critical issues (format/lint auto-fix etc.)
          echo "Non-critical pre-commit issues ignored for cross-platform test"
          exit 0